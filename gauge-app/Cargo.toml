[package]
name = "gauge-app"
version = "0.1.0"
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Orbital permission admin UI (PermissionRoutes at /permission)"

[lints]
workspace = true

[dependencies]
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
leptos_axum = { workspace = true, optional = true }

icondata = { workspace = true }
icondata_core = { workspace = true }
turf = { workspace = true }

http = { workspace = true }
cfg-if = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
log = { workspace = true }

# Non-optional: `valence::RecordId` is part of the hydrate HistoryTimeline surface.
# Keep defaults off so hydrate/wasm does not pull sqlite/tokio/mio.
valence = { workspace = true, default-features = false }
uf-product = { workspace = true, default-features = false }
uf-integrations = { workspace = true, default-features = false }
uf-search-core = { workspace = true, default-features = false }
lepton-shell = { workspace = true, default-features = false }
orbital-macros = { workspace = true }
orbital-theme = { workspace = true, default-features = false }
orbital-paging = { workspace = true }
orbital-history = { workspace = true, default-features = false }
uf-product-macros = { workspace = true }
higgs = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
gauge = { workspace = true, default-features = false }
record-history = { workspace = true, default-features = false, optional = true }
record-history-leptos = { workspace = true, default-features = false }
wasm-bindgen = { version = "=0.2.126" }
web-sys = { version = "=0.3.103", features = ["Element", "HtmlElement", "Node", "Document"] }

[features]
default = []
# Lab-only process overrides for Playwright seeds (gauge-uf-app-e2e). Not for hosts.
e2e-lab = []
hydrate = [
    "leptos/hydrate",
    "uf-product/hydrate",
    "uf-integrations/hydrate",
    "orbital-theme/hydrate",
    "lepton-shell/hydrate",
    "orbital-paging/hydrate",
    "orbital-history/hydrate",
    "record-history-leptos/hydrate"]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:higgs",
    "higgs/ssr",
    "dep:async-trait",
    "uf-product/ssr",
    "uf-integrations/ssr",
    "orbital-theme/ssr",
    "lepton-shell/ssr",
    "uf-search-core/ssr",
    "gauge/ssr",
    "valence/mem",
    "valence/sqlite",
    "orbital-paging/ssr",
    "orbital-history/ssr",
    "dep:record-history",
    "record-history/ssr",
    "record-history-leptos/ssr"]
