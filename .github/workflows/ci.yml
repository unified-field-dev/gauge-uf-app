# PR / merge gate aligned with docs/VERIFICATION.md (gauge-app + Playwright).
# Standalone checkout — UF deps resolve via git branch = main on unified-field-dev.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CARGO_TARGET_DIR: target-gauge-uf-app
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: 1
  # Leptos workspace deps enable the `nightly` feature.
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly-2026-08-07
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt -p gauge-app -p gauge-uf-app-e2e -- --check

  clippy:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly-2026-08-07
          components: clippy
      - name: cargo clippy (gauge-app SSR)
        run: >
          cargo clippy -p gauge-app --features ssr --all-targets --
          -D warnings -A clippy::pedantic -A clippy::nursery
        # gauge-uf-app-e2e is a lab harness (expect-heavy); skip clippy there.

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly-2026-08-07
      - name: cargo test (gauge-app SSR)
        run: cargo test -p gauge-app --features ssr
      - name: cargo check (gauge-app + e2e host SSR)
        run: |
          cargo check -p gauge-app --features ssr
          cargo check -p gauge-uf-app-e2e --features ssr

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly-2026-08-07
          targets: wasm32-unknown-unknown
      - name: Install cargo-leptos
        run: cargo install cargo-leptos --locked --version 0.3.6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gauge-uf-app-e2e/end2end/package-lock.json
      - name: Install npm dependencies
        working-directory: gauge-uf-app-e2e/end2end
        run: npm ci
      - name: Get Playwright version
        id: pw-version
        working-directory: gauge-uf-app-e2e/end2end
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-gauge-uf-app
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: gauge-uf-app-e2e/end2end
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps when cache hit
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: gauge-uf-app-e2e/end2end
        run: npx playwright install-deps chromium
      - name: cargo leptos end-to-end
        env:
          CI: true
        run: cargo leptos end-to-end --project gauge-uf-app-e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-gauge-uf-app-${{ github.run_id }}
          path: |
            gauge-uf-app-e2e/end2end/playwright-report/
            gauge-uf-app-e2e/end2end/test-results/
          if-no-files-found: ignore

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly-2026-08-07
      - name: cargo doc (gauge-app, deny broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken-intra-doc-links"
        run: cargo doc -p gauge-app --features ssr --no-deps
